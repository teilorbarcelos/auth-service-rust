[package]
name = "auth-service-rust"
version = "0.1.0"
edition = "2021"
default-run = "auth-service-rust"

[dependencies]
tokio = { version = "1.37.0", features = ["full"] }
axum = { version = "0.7.5", features = ["macros", "http1"] }
tower = { version = "0.4.13", features = ["util"] }
tower-http = { version = "0.5.2", features = ["cors"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
sea-orm = { version = "0.12.15", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros", "with-chrono", "with-json"] }

redis = { version = "0.24.0", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.14.0"
bcrypt = "0.15.1"
jsonwebtoken = "9.3.0"
dotenvy = "0.15.7"
chrono = { version = "0.4.37", features = ["serde"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
uuid = { version = "1.8.0", features = ["serde", "v4"] }
once_cell = "1.19.0"
futures-util = "0.3.30"

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
